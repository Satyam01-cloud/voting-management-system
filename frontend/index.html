<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Voting Management System</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Voting System</h1>
        
        <!-- Login Form -->
        <div id="login-section">
            <h2>Login</h2>
            <form id="login-form">
                <div class="form-group">
                    <label>Voter ID</label>
                    <input type="text" id="login-voterId" required>
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <input type="password" id="login-password" required>
                </div>
                <button type="submit">Login</button>
            </form>
            <p>Don't have an account? <a href="#" onclick="toggleView(event)">Register here</a></p>
        </div>

        <!-- Register Form -->
        <div id="register-section" style="display: none;">
            <h2>Register</h2>
            <form id="register-form">
                <div class="form-group">
                    <label>Voter ID</label>
                    <input type="text" id="reg-voterId" required>
                </div>
                <div class="form-group">
                    <label>Full Name</label>
                    <input type="text" id="reg-name" required>
                </div>
                <div class="form-group">
                    <label>Phone Number</label>
                    <input type="text" id="reg-phone" required>
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <input type="password" id="reg-password" required>
                </div>
                <button type="submit">Register</button>
            </form>
            <p>Already registered? <a href="#" onclick="toggleView(event)">Login here</a></p>
        </div>
    </div>

    <script>
        function toggleView(e) {
            e.preventDefault();
            const l = document.getElementById('login-section');
            const r = document.getElementById('register-section');
            l.style.display = l.style.display === 'none' ? 'block' : 'none';
            r.style.display = r.style.display === 'none' ? 'block' : 'none';
        }
    </script>
    <script src="script.js"></script>
</body>
</html>
